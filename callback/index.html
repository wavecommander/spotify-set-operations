<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify Authentication Callback | Music Sets</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #181818;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 32px 24px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #1db954;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      margin: 0 0 10px;
      font-size: 1.25rem;
    }
    p {
      color: #b3b3b3;
      font-size: 0.9rem;
      margin: 0 0 20px;
      line-height: 1.4;
    }
    .error-msg {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      word-break: break-word;
    }
    .btn {
      display: inline-block;
      padding: 10px 24px;
      border-radius: 20px;
      background: #1db954;
      color: #000000;
      font-weight: 700;
      text-decoration: none;
      font-size: 0.9rem;
      transition: background 0.15s ease;
    }
    .btn:hover {
      background: #1ed760;
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="spinner" class="spinner"></div>
    <h2 id="title">Authorizing with Spotify</h2>
    <p id="status-text">Exchanging authorization code for secure access token via PKCE...</p>
    <div id="error-container" style="display: none;"></div>
    <div id="action-container" style="display: none;">
      <a href="../" class="btn">Return to Application</a>
    </div>
  </div>

  <script type="module">
    import { spotifyAuth } from '../js/providers/spotify/spotify-auth.js';
    import { ytmusicAuth } from '../js/providers/ytmusic/ytmusic-auth.js';
    import { Storage } from '../js/utils/storage.js';

    async function handleAuth() {
      const spinner = document.getElementById('spinner');
      const title = document.getElementById('title');
      const statusText = document.getElementById('status-text');
      const errorContainer = document.getElementById('error-container');
      const actionContainer = document.getElementById('action-container');

      const params = new URLSearchParams(window.location.search);
      const state = params.get('state') || '';
      const isYouTube = state.startsWith('ytmusic:') || Storage.get('sso_ytmusic_auth_state') === state;

      const providerName = isYouTube ? 'YouTube Music' : 'Spotify';
      if (isYouTube && spinner) {
        spinner.style.borderTopColor = '#ff0000';
      }
      title.textContent = `Authorizing with ${providerName}`;
      statusText.textContent = `Exchanging authorization code for secure access token via PKCE...`;

      try {
        const authService = isYouTube ? ytmusicAuth : spotifyAuth;
        const success = await authService.handleCallback();
        if (success) {
          Storage.set('sso_active_provider_id', isYouTube ? 'ytmusic' : 'spotify');
          title.textContent = 'Connected Successfully!';
          statusText.textContent = 'Redirecting back to Music Sets...';
          setTimeout(() => {
            window.location.href = '../';
          }, 600);
        } else {
          // If no code was present or error occurred
          title.textContent = 'Authentication Incomplete';
          statusText.textContent = 'No authorization code was found in the callback URL.';
          if (spinner) spinner.style.display = 'none';
          actionContainer.style.display = 'block';
        }
      } catch (err) {
        if (spinner) spinner.style.display = 'none';
        title.textContent = 'Authentication Failed';
        statusText.textContent = `An error occurred during ${providerName} authorization.`;
        errorContainer.textContent = err.message || String(err);
        errorContainer.className = 'error-msg';
        errorContainer.style.display = 'block';
        actionContainer.style.display = 'block';
      }
    }

    handleAuth();
  </script>
</body>
</html>
